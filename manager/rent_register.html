<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../favicon.ico?v=2" sizes="any">
<link rel="icon" href="../shared/icons/house.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../shared/icons/apple-touch-icon.png">
<link rel="manifest" href="../shared/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="LGD PORTAL">
<link rel="stylesheet" href="../shared/site.css">
<title>Rent Register</title>
<!--
  The monthly rent register (the user, 2026-09-29): every unit, its tenants
  with their email and phone, and a line to write the date that month's
  rent was received. Printable for now - one sheet a month, filled in by
  hand.

  Units come from documents/properties.json (the same table as the
  documents' popup), so a unit with nobody in it still gets its row. The
  tenants come from `people` - residents, matched to a unit by their
  property_id's address and apt - through list_residents (supabase/
  migrations/003) on GitHub Pages, or /api/residents from the FastAPI app.
  Both let in only a manager or an admin.
-->
<style>
  @page {
    size: letter;
    margin: 0.5in;
    @bottom-center {
      content: "Page " counter(page) " of " counter(pages);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 9pt;
      color: #444;
    }
  }
  :root { --ink: #111; --muted: #6b6a66; --line: #333; --accent: #006747; }
  html, body { margin: 0; padding: 0; background: #fff; color: var(--ink); }
  body {
    font-family: "Segoe UI", Arial, Helvetica, sans-serif;
    font-size: 10pt;
    line-height: 1.3;
    padding: 16px 16px 96px;
  }
  /* On screen the register is the sheet of Letter paper it prints on (the
     user, 2026-09-30: "look like a piece of paper"): 8.5 x 11 with the
     same 0.5in margins as @page, so it reads exactly as it will print -
     the same look as the documents' .sheet. On a phone it is zoomed down
     to fit (fitSheet below) rather than reflowed. */
  .register { width: 7.5in; margin: 0 auto; }
  @media screen {
    html, body { background: #e9e7e2; }
    body { padding: 12px 0 88px; }
    .register {
      box-sizing: border-box;
      width: 8.5in;
      min-height: 11in;
      padding: 0.5in;
      background: #fff;
      box-shadow: 0 1px 8px rgba(0, 0, 0, .18);
    }
  }
  .company { font-size: 11pt; font-weight: 700; margin: 0; text-align: center; }
  h1 { font-size: 16pt; margin: 2px 0 10px; text-align: center; letter-spacing: .04em; }
  .month { text-align: center; margin: 0 0 14px; font-size: 11pt; }
  .month .blank { display: inline-block; min-width: 2.4in; border-bottom: 1px solid var(--line); font-weight: 700; }
  /* Date received: a date box on screen, saved as soon as it is picked;
     on paper the recorded date, or the blank cell to write one in. */
  td.received { padding: 2px 4px; }
  td.received input {
    width: 100%; box-sizing: border-box; font: inherit; font-size: 9.5pt;
    padding: 2px 3px; border: 1px solid #c8c8c8; border-radius: 3px; background: #fff;
  }
  td.received.saving input { border-color: #999; }
  td.received.saved input { border-color: var(--accent); }
  td.received.failed input { border-color: #a4262c; background: #fdecea; }
  td.received .on-paper { display: none; }
  /* The month popup, before anything else. */
  dialog.month-popup {
    width: min(360px, calc(100vw - 32px)); border: 1px solid #ccc; border-radius: 10px;
    padding: 20px 22px; box-shadow: 0 12px 40px rgba(0, 0, 0, .3); font-size: 11pt;
  }
  dialog.month-popup::backdrop { background: rgba(0, 0, 0, .45); }
  dialog.month-popup h2 { margin: 0 0 12px; font-size: 14pt; }
  dialog.month-popup .pickers { display: flex; gap: 10px; margin: 0 0 16px; }
  dialog.month-popup label { display: flex; flex-direction: column; gap: 4px; flex: 1; font-size: 10pt; color: var(--muted); }
  dialog.month-popup select { font: inherit; font-size: 16px; padding: 7px 8px; border: 1px solid #ccc; border-radius: 6px; background: #fff; color: var(--ink); }
  dialog.month-popup .buttons { display: flex; gap: 10px; justify-content: flex-end; align-items: center; }
  dialog.month-popup button, dialog.month-popup a {
    font: inherit; font-weight: 600; padding: 8px 16px; border-radius: 6px; cursor: pointer; text-decoration: none;
    border: 1px solid var(--accent); background: var(--accent); color: #fff;
  }
  dialog.month-popup a { background: #fff; color: var(--accent); }
  .status { color: var(--muted); text-align: center; }
  .status.error { color: #a4262c; }
  table { width: 100%; border-collapse: collapse; }
  th, td { border: 1px solid var(--line); padding: 4px 6px; text-align: left; vertical-align: middle; }
  th { font-size: 9pt; text-transform: uppercase; letter-spacing: .03em; background: #eef3f1; }
  /* Room to write a date by hand, and every unit on one sheet of paper. */
  td { height: 0.3in; }
  col.apartment { width: 1.8in; } col.tenant { width: 1.45in; }
  col.phone { width: 1.1in; } col.received { width: 1.2in; }
  td.apartment { white-space: nowrap; font-weight: 600; }
  td .line + .line { margin-top: 2px; }
  td.email { word-break: break-all; }
  tr { break-inside: avoid; page-break-inside: avoid; }
  thead { display: table-header-group; }  /* the header row again on every printed page */
  tbody.building tr:first-child td { border-top-width: 2px; }
  .vacant { color: var(--muted); font-style: italic; }
  .paper-buttons {
    position: fixed; right: 16px; bottom: 16px; z-index: 20; display: flex; gap: 10px;
  }
  .paper-buttons a {
    padding: 10px 20px; border: 1px solid var(--accent); border-radius: 999px;
    background: #fff; color: var(--accent); font: inherit; font-size: 11pt; text-decoration: none;
    box-shadow: 0 3px 12px rgba(0, 0, 0, .25);
  }
  .paper-buttons a[hidden] { display: none; }
  .paper-buttons a#print-register { background: var(--accent); color: #fff; }
  @media print {
    .paper-buttons { display: none; }
    body { padding: 0; font-size: 9.5pt; }
    th { background: none; }
    .status { display: none; }
    td.received input { display: none; }
    td.received .on-paper { display: block; }
    .register { zoom: 1 !important; }
  }
</style>
</head>
<body>
<div class="register">
  <p class="company">Lower Garden District Properties, Inc.</p>
  <h1>MONTHLY RENT REGISTER</h1>
  <p class="month">Month of <span class="blank" id="month-name"></span></p>
  <p class="status" id="status" role="status">Loading…</p>
  <div>
    <table id="register" hidden>
      <colgroup>
        <col class="apartment"><col class="tenant"><col class="email"><col class="phone"><col class="received">
      </colgroup>
      <thead>
        <tr><th>Apartment</th><th>Tenant</th><th>Email</th><th>Phone</th><th>Date received</th></tr>
      </thead>
    </table>
  </div>
</div>
<!-- The month and year come first (the user, 2026-09-30): the register is
     for one month, which decides whose lease is shown and whose rent dates
     are recorded. -->
<dialog class="month-popup" id="month-dialog" aria-labelledby="month-dialog-title">
  <form id="month-form">
    <h2 id="month-dialog-title">Which month?</h2>
    <div class="pickers">
      <label>Month <select id="pick-month"></select></label>
      <label>Year <select id="pick-year"></select></label>
    </div>
    <div class="buttons">
      <a href="index.html">Back</a>
      <button type="submit">Open register</button>
    </div>
  </form>
</dialog>
<!-- Back and Print only, floating like the printed documents' (the user,
     2026-09-30: no Home, no Change month). Not a .site-float group, which
     shared/footer.js would add Home to - and this page, like the
     documents, does not load that script, so it has no site footer
     under the paper either. -->
<div class="paper-buttons">
  <a href="index.html">Back</a>
  <a href="#" id="save-register" data-save-pdf hidden>Save</a>
  <a href="#" id="print-register" hidden>Print</a>
</div>
<script src="../shared/auth.js"></script>
<!-- Save PDF beside Print (the user, 2026-09-30). -->
<script src="../shared/save-pdf.js"></script>
<script>
"use strict";
(function () {
  const status = document.getElementById("status");
  const table = document.getElementById("register");
  const printLink = document.getElementById("print-register");
  const monthDialog = document.getElementById("month-dialog");
  const pickMonth = document.getElementById("pick-month");
  const pickYear = document.getElementById("pick-year");
  const MONTHS = ["January", "February", "March", "April", "May", "June", "July",
                  "August", "September", "October", "November", "December"];
  let via = null;         // "api" or "supabase", once known
  let properties = null;  // documents/properties.json, loaded once
  let month = null;       // "YYYY-MM" on show

  function fail(text) {
    status.textContent = text;
    status.className = "status error";
    status.hidden = false;
  }

  // Who is asking, and where the data comes from: the FastAPI app when it
  // served this page (HTTP Basic has already checked the login), Supabase
  // on GitHub Pages.
  async function backend() {
    try {
      const response = await fetch("/api/config");
      if (response.ok) return "api";
    } catch (error) {
      /* No backend here - the normal case on GitHub Pages. */
    }
    const auth = window.LGD.auth;
    if (!auth.configured) throw new Error("This site is not connected to its login service yet.");
    const result = await auth.requireRole(["manager", "admin"]);
    if (result.reason === "signed-out") return null;  // already heading to the login page
    if (!result.ok) throw new Error("The rent register is for managers.");
    return "supabase";
  }

  async function api(path, options) {
    const response = await fetch(path, options);
    const payload = await response.json().catch(() => ({}));
    if (!response.ok) {
      throw new Error(typeof payload.detail === "string" ? payload.detail : "That did not work.");
    }
    return payload;
  }

  // Residents whose recorded lease covers the month (or who have no lease
  // dates), and the rent dates recorded for it.
  async function residents() {
    if (via === "api") return (await api(`/api/residents?month=${month}`)).residents;
    return window.LGD.auth.rpc("list_residents", { month });
  }
  async function payments() {
    if (via === "api") return (await api(`/api/rent-payments?month=${month}`)).payments;
    return window.LGD.auth.rpc("list_rent_payments", { month });
  }
  async function savePayment(address, unit, receivedOn) {
    const body = { month, address, unit, received_on: receivedOn };
    if (via === "api") {
      return (await api("/api/rent-payments", {
        method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
      })).payment;
    }
    return window.LGD.auth.rpc("set_rent_payment", body);
  }

  function monthName(value) {
    return `${MONTHS[Number(value.slice(5)) - 1]} ${value.slice(0, 4)}`;
  }

  // "2026-09-03" reads "Thu, Sep 3, 2026" on paper - with the day of the
  // week (the user, 2026-09-30).
  const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  function paperDate(value) {
    if (!value) return "";
    const [y, m, d] = value.split("-").map(Number);
    const day = DAYS[new Date(y, m - 1, d).getDay()];
    return `${day}, ${MONTHS[m - 1].slice(0, 3)} ${d}, ${y}`;
  }

  function cell(className, lines) {
    const td = document.createElement("td");
    if (className) td.className = className;
    for (const text of lines) {
      const line = document.createElement("div");
      line.className = "line";
      line.textContent = text || "";
      td.append(line);
    }
    return td;
  }

  // The date box for one apartment, saved the moment it changes; clearing
  // it takes the date back off.
  function receivedCell(address, unit, receivedOn) {
    const td = cell("received", []);
    const place = unit ? `${address}, Unit ${unit}` : address;
    const input = document.createElement("input");
    input.type = "date";
    input.value = receivedOn || "";
    input.setAttribute("aria-label", `Date rent received for ${place}`);
    const onPaper = document.createElement("span");
    onPaper.className = "on-paper";
    onPaper.textContent = paperDate(receivedOn);
    let saved = input.value;
    input.addEventListener("change", async () => {
      td.className = "received saving";
      try {
        const payment = await savePayment(address, unit, input.value);
        saved = payment.received_on || "";
        onPaper.textContent = paperDate(saved);
        td.className = "received saved";
      } catch (error) {
        input.value = saved;
        td.className = "received failed";
        input.title = error.message;
      }
    });
    td.append(input, onPaper);
    return td;
  }

  // One row per unit (a house with no units is one row), every tenant of
  // that unit in it, one under the other; a unit with nobody on file
  // leaves its tenant blank to write in.
  function render(people, paid) {
    table.querySelectorAll("tbody").forEach((body) => body.remove());
    const key = (address, unit) => `${address}|${unit || ""}`;
    const dates = new Map(paid.map((p) => [key(p.address, p.unit), p.received_on]));
    const byUnit = new Map();
    for (const person of people) {
      const k = key(person.address, person.unit);
      if (!byUnit.has(k)) byUnit.set(k, []);
      byUnit.get(k).push(person);
    }
    const placed = new Set();
    for (const property of properties) {
      const body = document.createElement("tbody");
      body.className = "building";
      const units = property.units.length ? property.units : [""];
      for (const unit of units) {
        const k = key(property.address, unit);
        const tenants = byUnit.get(k) || [];
        placed.add(k);
        const row = document.createElement("tr");
        row.append(
          cell("apartment", [unit ? `${property.address}, Unit ${unit}` : property.address]),
          cell("", tenants.map((t) => t.full_name)),
          cell("email", tenants.map((t) => t.email)),
          cell("", tenants.map((t) => t.phone)),
          receivedCell(property.address, unit, dates.get(k))
        );
        body.append(row);
      }
      table.append(body);
    }
    // Anyone living at an address the table of apartments does not have
    // is still listed, rather than silently left off the register.
    const stray = people.filter((p) => !placed.has(key(p.address, p.unit)));
    if (stray.length) {
      const body = document.createElement("tbody");
      body.className = "building";
      for (const person of stray) {
        const row = document.createElement("tr");
        row.append(
          cell("apartment", [person.unit ? `${person.address}, Unit ${person.unit}` : person.address]),
          cell("", [person.full_name]), cell("email", [person.email]),
          cell("", [person.phone]),
          receivedCell(person.address, person.unit, dates.get(key(person.address, person.unit)))
        );
        body.append(row);
      }
      table.append(body);
    }
  }

  function fitSheet() {
    const sheet = document.querySelector(".register");
    sheet.style.zoom = "";
    const room = document.documentElement.clientWidth - 32;
    if (sheet.offsetWidth > room) sheet.style.zoom = String(room / sheet.offsetWidth);
  }
  fitSheet();
  window.addEventListener("resize", fitSheet);

  printLink.addEventListener("click", (event) => {
    event.preventDefault();
    window.print();
  });

  // The popup: every month, and a few years either side of this one.
  // It opens on the month in the address (?month=2026-09), else this one.
  const today = new Date();
  MONTHS.forEach((name, index) => pickMonth.add(new Option(name, String(index + 1).padStart(2, "0"))));
  for (let year = today.getFullYear() - 3; year <= today.getFullYear() + 1; year += 1) {
    pickYear.add(new Option(String(year), String(year)));
  }
  function askMonth() {
    const wanted = new URLSearchParams(window.location.search).get("month") || month
      || `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, "0")}`;
    if (/^[0-9]{4}-[0-9]{2}$/.test(wanted)) {
      pickMonth.value = wanted.slice(5);
      if (![...pickYear.options].some((o) => o.value === wanted.slice(0, 4))) {
        pickYear.add(new Option(wanted.slice(0, 4), wanted.slice(0, 4)));
      }
      pickYear.value = wanted.slice(0, 4);
    }
    monthDialog.showModal();
  }

  async function open(chosen) {
    month = chosen;
    const url = new URL(window.location.href);
    url.searchParams.set("month", month);
    history.replaceState(null, "", url);
    document.getElementById("month-name").textContent = monthName(month);
    document.title = `Rent Register - ${monthName(month)}`;
    status.textContent = "Loading…";
    status.className = "status";
    status.hidden = false;
    try {
      const [people, paid] = await Promise.all([residents(), payments()]);
      render(people, paid);
      status.hidden = true;
      table.hidden = false;
      printLink.hidden = false;
      document.getElementById("save-register").hidden = false;
    } catch (error) {
      fail(error.message || "The rent register could not be loaded.");
    }
  }

  document.getElementById("month-form").addEventListener("submit", (event) => {
    event.preventDefault();
    monthDialog.close();
    open(`${pickYear.value}-${pickMonth.value}`);
  });

  (async function () {
    try {
      via = await backend();
      if (!via) return;
      const response = await fetch("../documents/properties.json", { cache: "no-store" });
      properties = (await response.json()).properties;
      status.hidden = true;
      askMonth();
    } catch (error) {
      fail(error.message || "The rent register could not be loaded.");
    }
  })();
})();
</script>
</body>
</html>
