<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../favicon.ico?v=2" sizes="any">
<link rel="icon" href="../shared/icons/house.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../shared/icons/apple-touch-icon.png">
<link rel="manifest" href="../shared/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Residential Guide">
<title>Rent Ledger</title>
<!--
  One apartment's rent, a year at a time - the rent register's second view
  (the user, 2026-10-02, with a photo of the paper rent card in the binder:
  "Secondary view of rent register should show history. Make a modern
  version of attached. Should be a paid checkbox too.").

  The card's heading - address, tenants and their phones, lease dates -
  and its table: a row a month with the date received, the rent, any
  deposit, Paid and a comment. Every change is saved as it is made, to
  rent_payments (supabase/migrations/013's save_rent_entry, or PUT
  /api/rent-entries from the FastAPI app), the same rows the register's
  date boxes write. The year switches back for the history.

  Opened from an apartment on the rent register:
  rent_ledger.html?address=1521%20St.%20Andrew%20St.&unit=%235&year=2026&month=2026-10
  (month is where Back returns the register to).
-->
<style>
  @page { size: letter; margin: 0.5in; }
  :root { --ink: #1c1c1a; --muted: #6b6a66; --line: #d6d4ce; --accent: #006747; --paid: #e8f3ee; }
  html, body { margin: 0; padding: 0; background: #e9e7e2; color: var(--ink); }
  body { font: 10.5pt/1.35 "Segoe UI", Arial, Helvetica, sans-serif; padding: 12px 0 88px; }
  /* A sheet of Letter paper, like the register; zoomed to fit a phone. */
  .ledger {
    box-sizing: border-box; width: 8.5in; min-height: 11in; margin: 0 auto; padding: 0.5in;
    background: #fff; box-shadow: 0 1px 8px rgba(0, 0, 0, .18);
  }
  .company { margin: 0; font-size: 9pt; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .title-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin: 2px 0 14px; }
  h1 { margin: 0; font-size: 18pt; line-height: 1.15; }
  h1 .unit { color: var(--accent); }
  .years { display: flex; align-items: center; gap: 4px; flex: none; }
  .years a, .years span {
    display: inline-block; min-width: 28px; padding: 4px 9px; border-radius: 999px; text-align: center;
    text-decoration: none; color: var(--accent); font-weight: 600;
  }
  .years span { background: var(--accent); color: #fff; font-size: 13pt; padding: 3px 14px; }
  .years a:hover { background: #eef3f1; }

  .facts { display: grid; grid-template-columns: 1fr auto; gap: 12px 24px; margin: 0 0 16px;
           padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: #fafaf8; }
  .facts[hidden] { display: none; }
  .facts h2 { margin: 0 0 6px; font-size: 8pt; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .tenants { margin: 0; padding: 0; list-style: none; }
  .tenants li { display: flex; flex-wrap: wrap; gap: 2px 14px; padding: 2px 0; }
  .tenants .name { font-weight: 700; min-width: 1.6in; }
  .tenants .contact { color: var(--muted); }
  .lease p { margin: 0; white-space: nowrap; }
  .none { color: var(--muted); font-style: italic; }

  table { width: 100%; border-collapse: collapse; }
  th { padding: 6px 6px; text-align: left; font-size: 8pt; letter-spacing: .06em; text-transform: uppercase;
       color: var(--muted); border-bottom: 2px solid var(--ink); }
  td { padding: 3px 6px; border-bottom: 1px solid var(--line); height: 0.36in; vertical-align: middle; }
  col.month { width: 1.05in; } col.date { width: 1.45in; } col.rent { width: 1.05in; }
  col.deposit { width: 1.05in; } col.paid { width: 0.55in; }
  td.month { font-weight: 600; }
  th.paid, td.paid { text-align: center; }
  tr.is-paid td { background: var(--paid); }
  td input {
    box-sizing: border-box; width: 100%; font: inherit; padding: 3px 5px;
    border: 1px solid transparent; border-radius: 4px; background: transparent; color: inherit;
  }
  td input:hover { border-color: var(--line); background: #fff; }
  td input:focus { outline: none; border-color: var(--accent); background: #fff; }
  td.money { position: relative; }
  td.money::before { content: "$"; position: absolute; left: 8px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  td.money input { padding-left: 14px; text-align: right; }
  td.paid input { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }
  tr.saving td { opacity: .75; }
  tr.failed td { background: #fdecea; }
  .row-error { display: block; font-size: 8pt; color: #a4262c; }
  tfoot td { border-bottom: 0; border-top: 2px solid var(--ink); font-weight: 700; }
  tfoot td.money::before { content: none; }
  tfoot td.money { text-align: right; padding-right: 11px; }
  .status { color: var(--muted); text-align: center; }
  .choose .hint { margin: 0 0 12px; color: var(--muted); }
  .choose-building { padding: 10px 0; border-top: 1px solid var(--line); }
  .choose-building h2 { margin: 0 0 8px; font-size: 12pt; }
  .choose-units { display: flex; flex-wrap: wrap; gap: 8px; }
  .choose-units a { padding: 6px 14px; border: 1px solid var(--accent); border-radius: 999px;
                    color: var(--accent); text-decoration: none; font-weight: 600; }
  .choose-units a:hover { background: #eef3f1; }
  .status.error { color: #a4262c; }

  .paper-buttons { position: fixed; right: 16px; bottom: 16px; z-index: 20; display: flex; gap: 10px; }
  .paper-buttons a {
    padding: 10px 20px; border: 1px solid var(--accent); border-radius: 999px;
    background: #fff; color: var(--accent); font: inherit; font-size: 11pt; text-decoration: none;
    box-shadow: 0 3px 12px rgba(0, 0, 0, .25);
  }
  .paper-buttons a[hidden] { display: none; }
  .paper-buttons a#print-ledger { background: var(--accent); color: #fff; }
  @media print {
    html, body { background: #fff; }
    body { padding: 0; }
    .ledger { width: auto; min-height: 0; padding: 0; box-shadow: none; zoom: 1 !important; }
    .paper-buttons, .status, .years a { display: none; }
    .years span { background: none; color: var(--ink); padding: 0; }
    td input { border: 0 !important; padding-left: 0; background: none !important; }
    td.money input { padding-left: 10px; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
<div class="ledger">
  <p class="company" id="company">LGD (Lower Garden District Properties), Inc.</p>
  <div class="title-row">
    <h1 id="place">Rent Ledger</h1>
    <nav class="years" id="years" aria-label="Year"></nav>
  </div>
  <p class="status" id="status" role="status">Loading…</p>
  <div class="facts" id="facts" hidden>
    <div>
      <h2>Tenants</h2>
      <ul class="tenants" id="tenants"></ul>
    </div>
    <div class="lease">
      <h2>Lease</h2>
      <div id="lease"></div>
    </div>
  </div>
  <table id="ledger" hidden>
    <colgroup>
      <col class="month"><col class="date"><col class="rent"><col class="deposit"><col class="paid"><col class="note">
    </colgroup>
    <thead>
      <tr><th>Month</th><th>Date received</th><th>Rent</th><th>Deposit</th><th class="paid">Paid</th><th>Comments</th></tr>
    </thead>
    <tbody id="months"></tbody>
    <tfoot>
      <tr><td id="paid-count"></td><td></td><td class="money" id="rent-total"></td>
          <td class="money" id="deposit-total"></td><td></td><td></td></tr>
    </tfoot>
  </table>
</div>
<div class="paper-buttons">
  <a href="rent_register.html" id="back">Back</a>
  <a href="#" id="save-ledger" data-save-pdf hidden>Save</a>
  <a href="#" id="print-ledger" hidden>Print</a>
</div>
<script src="../shared/auth.js"></script>
<script src="../shared/save-pdf.js"></script>
<!-- The company picker, for a login with more than one (the user, 2026-10-02). -->
<script src="../shared/client-picker.js"></script>
<script>
"use strict";
try {
  const client = JSON.parse(localStorage.getItem("lgd-client") || "null");
  if (client && client.name) document.getElementById("company").textContent = client.name;
} catch (error) {
  /* Nothing remembered: the default name stays. */
}

(function () {
  const MONTHS = ["January", "February", "March", "April", "May", "June", "July",
                  "August", "September", "October", "November", "December"];
  const params = new URLSearchParams(window.location.search);
  const address = (params.get("address") || "").trim();
  const unit = (params.get("unit") || "").trim();
  const today = new Date();
  const pad = (n) => String(n).padStart(2, "0");
  const todayText = `${today.getFullYear()}-${pad(today.getMonth() + 1)}-${pad(today.getDate())}`;
  const year = /^[0-9]{4}$/.test(params.get("year") || "") ? params.get("year") : String(today.getFullYear());
  const status = document.getElementById("status");
  let via = null;

  // Back to the register, on the month it was opened from.
  const back = document.getElementById("back");
  if (/^[0-9]{4}-[0-9]{2}$/.test(params.get("month") || "")) back.href = `rent_register.html?month=${params.get("month")}`;
  // Switching company from one apartment's ledger goes to the list of the
  // other company's (shared/client-picker.js).
  if (address) document.body.setAttribute("data-after-switch", "rent_ledger.html");
  // Chosen from the list of ledgers: back to that list.
  if (params.get("from") === "list") back.href = "rent_ledger.html";

  function fail(text) {
    status.textContent = text;
    status.className = "status error";
    status.hidden = false;
  }

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  let client = null;  // the company being worked in
  async function backend() {
    try {
      const response = await fetch("/api/config");
      if (response.ok) {
        client = (await response.json()).user.manager_id || null;
        return "api";
      }
    } catch (error) {
      /* No backend here - the normal case on GitHub Pages. */
    }
    const auth = window.LGD.auth;
    if (!auth.configured) throw new Error("This site is not connected to its login service yet.");
    const result = await auth.requireRole(["manager", "admin"]);
    if (result.reason === "signed-out") return null;  // already heading to the login page
    if (!result.ok) throw new Error("The rent ledger is for managers.");
    client = result.profile.manager_id || null;
    return "supabase";
  }

  async function api(path, options) {
    const response = await fetch(path, options);
    const payload = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(typeof payload.detail === "string" ? payload.detail : "That did not work.");
    return payload;
  }

  async function residents() {
    if (via === "api") return (await api("/api/residents")).residents;
    return window.LGD.auth.rpc("list_residents", {});
  }

  async function history() {
    if (via === "api") {
      const query = new URLSearchParams({ address, unit, year });
      return (await api(`/api/rent-history?${query}`)).entries;
    }
    return window.LGD.auth.rpc("list_rent_history", { address, unit, year });
  }

  async function save(entry) {
    const body = { address, unit, ...entry };
    if (via === "api") {
      return (await api("/api/rent-entries", {
        method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
      })).entry;
    }
    return window.LGD.auth.rpc("save_rent_entry", body);
  }

  function shortDate(value) {
    if (!value) return "";
    const [y, m, d] = value.split("-").map(Number);
    return `${MONTHS[m - 1].slice(0, 3)} ${d}, ${y}`;
  }

  function money(value) {
    return value.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function amountOf(text) {
    const value = Number(String(text || "").replace(/[$,]/g, ""));
    return Number.isFinite(value) ? value : 0;
  }

  // The year switcher: the years either side of this one, for the history.
  function years() {
    const nav = document.getElementById("years");
    const link = (y, text) => {
      const a = el("a", "", text);
      const query = new URLSearchParams(params);
      query.set("year", String(y));
      a.href = `?${query}`;
      a.setAttribute("aria-label", `Year ${y}`);
      return a;
    };
    nav.append(link(Number(year) - 1, "‹ " + (Number(year) - 1)), el("span", "", year));
    if (Number(year) < today.getFullYear() + 1) nav.append(link(Number(year) + 1, (Number(year) + 1) + " ›"));
  }

  function heading(people) {
    const place = document.getElementById("place");
    place.textContent = address;
    if (unit) place.append(", ", el("span", "unit", `Unit ${unit}`));
    document.title = `Rent Ledger - ${address}${unit ? ", Unit " + unit : ""} ${year}`;

    const list = document.getElementById("tenants");
    const mine = people.filter((p) => p.address === address && (p.unit || "") === unit);
    if (!mine.length) list.append(el("li", "none", "Nobody on file."));
    for (const person of mine) {
      const item = el("li");
      item.append(el("span", "name", person.full_name || person.email || "Resident"));
      const contact = [person.phone, person.email].filter(Boolean).join("  ·  ");
      if (contact) item.append(el("span", "contact", contact));
      list.append(item);
    }
    const lease = document.getElementById("lease");
    const starts = mine.map((p) => p.lease_start).filter(Boolean).sort();
    const ends = mine.map((p) => p.lease_end).filter(Boolean).sort();
    if (starts.length || ends.length) {
      lease.append(el("p", "", `From ${shortDate(starts[0]) || "—"}`),
                   el("p", "", `To ${shortDate(ends[ends.length - 1]) || "—"}`));
    } else {
      lease.append(el("p", "none", "No dates on file."));
    }
    document.getElementById("facts").hidden = false;
  }

  const rows = [];

  function totals() {
    let paid = 0, rent = 0, deposit = 0;
    for (const row of rows) {
      if (row.paid.checked) {
        paid += 1;
        rent += amountOf(row.amount.value);
      }
      deposit += amountOf(row.deposit.value);
    }
    document.getElementById("paid-count").textContent = `${paid} of 12 paid`;
    document.getElementById("rent-total").textContent = `$${money(rent)}`;
    document.getElementById("deposit-total").textContent = deposit ? `$${money(deposit)}` : "";
  }

  // The rent a month most likely is: the nearest earlier month's, else
  // the nearest later one's.
  function usualRent(index) {
    for (let i = index - 1; i >= 0; i -= 1) if (rows[i].amount.value.trim()) return rows[i].amount.value.trim();
    for (let i = index + 1; i < rows.length; i += 1) if (rows[i].amount.value.trim()) return rows[i].amount.value.trim();
    return "";
  }

  function monthRow(index, entry) {
    const month = `${year}-${pad(index + 1)}`;
    const tr = el("tr");
    const input = (type, value, label) => {
      const box = document.createElement("input");
      box.type = type;
      box.value = value || "";
      box.setAttribute("aria-label", `${label}, ${MONTHS[index]} ${year}`);
      return box;
    };
    const date = input("date", entry.received_on, "Date received");
    const amount = input("text", entry.amount, "Rent");
    amount.inputMode = "decimal";
    const deposit = input("text", entry.deposit, "Deposit");
    deposit.inputMode = "decimal";
    const paid = input("checkbox", "", "Paid");
    paid.checked = !!entry.paid;
    const note = input("text", entry.note, "Comments");
    note.maxLength = 500;
    const error = el("span", "row-error");

    const cell = (className, ...children) => { const td = el("td", className); td.append(...children); return td; };
    tr.append(cell("month", MONTHS[index]), cell("date", date), cell("money", amount),
              cell("money", deposit), cell("paid", paid), cell("note", note, error));
    const row = { tr, date, amount, deposit, paid, note };
    rows.push(row);

    let saved = { received_on: date.value, amount: amount.value, deposit: deposit.value, paid: paid.checked, note: note.value };
    let timer = null;
    const paint = () => tr.classList.toggle("is-paid", paid.checked);
    paint();

    async function commit() {
      clearTimeout(timer);
      const entry = { month, received_on: date.value, amount: amount.value, deposit: deposit.value,
                      paid: paid.checked, note: note.value };
      if (JSON.stringify(entry) === JSON.stringify({ month, ...saved })) return;
      tr.classList.add("saving");
      tr.classList.remove("failed");
      error.textContent = "";
      try {
        const result = await save(entry);
        saved = { received_on: result.received_on || "", amount: result.amount, deposit: result.deposit,
                  paid: result.paid, note: result.note };
        if (document.activeElement !== amount) amount.value = saved.amount;
        if (document.activeElement !== deposit) deposit.value = saved.deposit;
      } catch (failure) {
        tr.classList.add("failed");
        error.textContent = failure.message || "Not saved.";
      } finally {
        tr.classList.remove("saving");
        totals();
      }
    }

    // Paid: ticking it fills an empty date with today and an empty rent
    // with the usual one, both still editable.
    paid.addEventListener("change", () => {
      if (paid.checked) {
        if (!date.value) date.value = todayText;
        if (!amount.value.trim()) amount.value = usualRent(index);
      }
      paint();
      commit();
    });
    date.addEventListener("change", commit);
    for (const box of [amount, deposit, note]) {
      box.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(commit, 900); totals(); });
      box.addEventListener("change", commit);
    }
    return tr;
  }

  // Opened with no apartment (the manager page's link, the user,
  // 2026-10-02: "link to both rent registers on manager's page"): every
  // apartment of the company, each opening its ledger for this year.
  async function choose() {
    const response = await fetch("../documents/properties.json", { cache: "no-store" });
    const properties = (await response.json()).properties
      .filter((property) => !client || property.manager_id === client);
    document.getElementById("place").textContent = "Rent Ledgers";
    document.title = "Rent Ledgers";
    document.getElementById("years").hidden = true;
    const list = el("div", "choose");
    list.append(el("p", "hint", "Choose an apartment."));
    for (const property of properties) {
      const group = el("div", "choose-building");
      group.append(el("h2", "", property.address));
      const links = el("div", "choose-units");
      for (const name of property.units.length ? property.units : [""]) {
        const a = el("a", "", name ? `Unit ${name}` : "Whole house");
        a.href = `?${new URLSearchParams({ address: property.address, unit: name, year, from: "list" })}`;
        links.append(a);
      }
      group.append(links);
      list.append(group);
    }
    status.hidden = true;
    status.after(list);
    back.href = "index.html";
  }

  function fitSheet() {
    const sheet = document.querySelector(".ledger");
    sheet.style.zoom = "";
    const room = document.documentElement.clientWidth - 16;
    if (sheet.offsetWidth > room) sheet.style.zoom = String(room / sheet.offsetWidth);
  }
  fitSheet();
  window.addEventListener("resize", fitSheet);

  document.getElementById("print-ledger").addEventListener("click", (event) => {
    event.preventDefault();
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    window.print();
  });

  (async function () {
    try {
      via = await backend();
      if (!via) return;
      if (!address) return choose();
      years();
      const [people, entries] = await Promise.all([residents(), history()]);
      heading(people || []);
      const byMonth = new Map((entries || []).map((e) => [e.month, e]));
      const body = document.getElementById("months");
      for (let i = 0; i < 12; i += 1) body.append(monthRow(i, byMonth.get(`${year}-${pad(i + 1)}`) || {}));
      totals();
      status.hidden = true;
      document.getElementById("ledger").hidden = false;
      document.getElementById("print-ledger").hidden = false;
      document.getElementById("save-ledger").hidden = false;
    } catch (error) {
      fail(error.message || "The rent ledger could not be loaded.");
    }
  })();
})();
</script>
</body>
</html>
