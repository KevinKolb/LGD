<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  // Tulane green/blue by default; ?org=O (or o) swaps in an orange scheme
  // instead, remembered via localStorage so it survives navigating here
  // from a page that set it (this app's links between pages don't carry
  // query strings). Set on <html> here, before <body> paints, so there's
  // no flash of the wrong colors.
  try {
    const params = new URLSearchParams(window.location.search);
    if (params.has("org")) {
      localStorage.setItem("lgd-org", params.get("org").toLowerCase());
    }
    if (localStorage.getItem("lgd-org") === "o") {
      document.documentElement.classList.add("theme-orange");
    }
  } catch (error) {
    /* localStorage unavailable (e.g. private browsing) - default colors. */
  }
</script>
<link rel="icon" href="../favicon.ico?v=1">
<link rel="stylesheet" href="../shared/site.css">
<title>Manager Dashboard</title>
<style>
  :root {
    --bg: #f6f5f2;
    --panel: #ffffff;
    --ink: #1c1c1a;
    --muted: #6b6a66;
    --line: #dcdad4;
    --accent: #1f5d4c;
    --accent-ink: #ffffff;
    --danger: #9b2c2c;
    --ok: #1f5d4c;
    --radius: 8px;
  }
  html.theme-orange {
    --accent: #d2601a;
    --ok: #d2601a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    background: var(--accent);
    color: var(--accent-ink);
    padding: 18px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  header h1 { margin: 0; font-size: 18px; letter-spacing: .01em; }
  header p { margin: 4px 0 0; opacity: .8; font-size: 13px; }
  main { width: 100%; max-width: 900px; margin: 0 auto; padding: 24px; }
  section {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px 22px;
    margin-bottom: 20px;
  }
  h2 {
    margin: 0 0 4px;
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
  }
  .hint { margin: 0 0 18px; color: var(--muted); font-size: 13px; }
  .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .button-link {
    display: inline-block;
    font: inherit;
    border-radius: 6px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: var(--accent-ink) !important;
    padding: 9px 16px;
    cursor: pointer;
    text-decoration: none;
    text-transform: uppercase;
    letter-spacing: .03em;
  }
  .button-link.secondary {
    background: transparent; color: var(--accent) !important;
  }
  a { color: var(--accent); }
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0, 0, 0, .5);
    display: flex; align-items: center; justify-content: center;
    z-index: 2000;
  }
  /* Needed alongside the rule above: a class selector outranks the
     browser's default [hidden] rule, so display:flex would win. */
  .modal-overlay[hidden] { display: none; }
  .modal-box {
    background: var(--panel);
    border-radius: var(--radius);
    padding: 28px 24px 24px;
    text-align: center;
    max-width: 340px;
    width: calc(100% - 48px);
  }
  .modal-box p { margin: 0 0 18px; font-weight: 600; }
  .modal-box .choices { display: flex; gap: 10px; justify-content: center; }
  .modal-box button {
    font: inherit;
    border-radius: 6px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: var(--accent-ink);
    padding: 9px 22px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: .03em;
  }
  .modal-box button.secondary { background: transparent; color: var(--accent); }
  /* Several rules here set display on elements the gate hides (header is
     flex), and any of them outranks the browser's default [hidden] rule.
     One override covers the lot. */
  [hidden] { display: none !important; }
  .gate {
    max-width: 340px;
    width: calc(100% - 48px);
    margin: 12vh auto 0;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 28px 24px 24px;
    text-align: center;
  }
  .gate h1 { margin: 0 0 6px; font-size: 18px; color: var(--accent); }
  .gate label {
    display: block; margin: 0 0 12px;
    color: var(--muted); font-size: 13px; font-weight: normal;
  }
  .gate input {
    width: 100%;
    padding: 9px 10px;
    margin-bottom: 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    font: inherit;
  }
  .gate button {
    font: inherit;
    width: 100%;
    border-radius: 6px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: var(--accent-ink);
    padding: 9px 16px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: .03em;
  }
  .gate .msg { margin: 10px 0 0; color: var(--danger); font-size: 13px; }
</style>
</head>
<body>
<form class="gate" id="gate">
  <h1>Manager Dashboard</h1>
  <label for="gate-password">Enter the manager password.</label>
  <input type="password" id="gate-password" autocomplete="current-password" required>
  <button type="submit">Continue</button>
  <p class="msg" id="gate-msg" hidden>That password is not right.</p>
</form>

<header hidden>
  <div>
    <h1>Manager Dashboard</h1>
    <p id="whoami">Welcome</p>
  </div>
</header>

<main hidden>
  <section>
    <h2>Paper lease</h2>
    <p class="hint">
      The standard residential lease, blank and unsigned &mdash; to print and fill
      in by hand, or just to look over.
    </p>
    <div class="actions">
      <a class="button-link secondary" id="print-lease-link"
         href="../print/lease_print.html" target="_blank" rel="noopener">Print paper lease</a>
    </div>
  </section>
</main>

<div id="parking-modal" class="modal-overlay" hidden>
  <div class="modal-box">
    <p>Off-street parking available?</p>
    <div class="choices">
      <button type="button" id="parking-yes">Yes</button>
      <button type="button" class="secondary" id="parking-no">No</button>
    </div>
  </div>
</div>

<script>
"use strict";

// --- Password gate -------------------------------------------------------
//
// A DETERRENT, NOT SECURITY. On GitHub Pages these files are static and
// public, so this only stops someone who types the URL - not anyone who
// views source, turns off JavaScript, or reads the repo, which is public.
// The one real gate is the backend's HTTP Basic auth on /manager/, which
// admits only manager and admin logins; when this page is served from
// there, /api/config succeeds and the gate opens on its own.
//
// The password is stored as a SHA-256 hash so it is not sitting in the
// source in plain text. That is not much protection either - a short or
// guessable phrase falls to an offline dictionary attack in seconds - so
// use a throwaway word here, never one reused anywhere else. To change it:
//   python -c "import hashlib;print(hashlib.sha256(b'NEW-PHRASE').hexdigest())"
const GATE_HASH = "c218b300c73bd6e04f9579cb20ac4e0256c444aecc42b57e5ec679398f0c5dd7";
const GATE_KEY = "lgd-manager-unlocked";

function unlock() {
  document.getElementById("gate").hidden = true;
  document.querySelector("header").hidden = false;
  document.querySelector("main").hidden = false;
}

async function sha256Hex(text) {
  const bytes = new TextEncoder().encode(text);
  const digest = await crypto.subtle.digest("SHA-256", bytes);
  return Array.from(new Uint8Array(digest))
    .map((b) => b.toString(16).padStart(2, "0"))
    .join("");
}

(function () {
  // Session-scoped, so closing the browser re-locks.
  try {
    if (sessionStorage.getItem(GATE_KEY) === "1") unlock();
  } catch (error) {
    /* sessionStorage unavailable - just ask for the password. */
  }

  document.getElementById("gate").addEventListener("submit", async (event) => {
    event.preventDefault();
    const input = document.getElementById("gate-password");
    const message = document.getElementById("gate-msg");
    let entered;
    try {
      entered = await sha256Hex(input.value);
    } catch (error) {
      // crypto.subtle needs a secure context (https or localhost).
      message.textContent = "This page must be opened over https to unlock.";
      message.hidden = false;
      return;
    }
    if (entered !== GATE_HASH) {
      message.textContent = "That password is not right.";
      message.hidden = false;
      input.select();
      return;
    }
    try {
      sessionStorage.setItem(GATE_KEY, "1");
    } catch (error) {
      /* Not remembering it is fine; the page still unlocks now. */
    }
    unlock();
  });
})();

// The paper lease has two mutually exclusive PARKING options, one of which
// gets crossed out. Asking here means the lease opens already set the right
// way, rather than the manager having to pick on the printout - the answer
// rides along as ?parking=yes|no, which the lease page reads on load.
(function () {
  const link = document.getElementById("print-lease-link");
  const modal = document.getElementById("parking-modal");

  function openLease(answer) {
    modal.hidden = true;
    // Called straight from a click, so this counts as a user gesture and
    // will not trip a popup blocker.
    window.open(`${link.getAttribute("href")}?parking=${answer}`, "_blank", "noopener");
  }

  link.addEventListener("click", (event) => {
    event.preventDefault();
    modal.hidden = false;
  });
  document.getElementById("parking-yes").addEventListener("click", () => openLease("yes"));
  document.getElementById("parking-no").addEventListener("click", () => openLease("no"));

  modal.addEventListener("click", (event) => {
    if (event.target === modal) modal.hidden = true;
  });
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && !modal.hidden) modal.hidden = true;
  });
})();

// Greets whoever is logged in, and opens the gate above without asking for
// the password again: reaching /api/config at all means the backend already
// checked a real manager or admin login. On GitHub Pages there is no
// backend, this fails, and the password gate stands. Everything else this
// page used to do lives in manager/working.html.
(async function () {
  try {
    const response = await fetch("/api/config");
    if (!response.ok) return;
    const config = await response.json();
    unlock();
    const firstName =
      (config.user.display_name || config.user.username || "").split(" ")[0];
    document.getElementById("whoami").textContent = config.user.is_admin
      ? `Welcome, ${firstName} (admin)`
      : `Welcome, ${firstName}`;
  } catch (error) {
    /* Leave the default greeting in place. */
  }
})();
</script>
<script src="account.js"></script>
<script src="../shared/footer.js"></script>
</body>
</html>
