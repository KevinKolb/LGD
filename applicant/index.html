<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  // Tulane green/blue by default; ?org=O (or o) swaps in an orange scheme
  // instead, remembered via localStorage so it survives navigating here
  // from a page that set it (this app's links between pages don't carry
  // query strings). Set on <html> here, before <body> paints, so there's
  // no flash of the wrong colors.
  try {
    const params = new URLSearchParams(window.location.search);
    if (params.has("org")) {
      localStorage.setItem("lgd-org", params.get("org").toLowerCase());
    }
    if (localStorage.getItem("lgd-org") === "o") {
      document.documentElement.classList.add("theme-orange");
    }
  } catch (error) {
    /* localStorage unavailable (e.g. private browsing) - default colors. */
  }
</script>
<link rel="icon" href="../favicon.ico?v=1">
<link rel="stylesheet" href="../shared/site.css">
<title>Applicant Portal</title>
<style>
  :root {
    --bg: #f6f5f2;
    --panel: #ffffff;
    --ink: #1c1c1a;
    --muted: #6b6a66;
    --line: #dcdad4;
    --accent: #1f5d4c;
    --accent2: #71c5e8;
    --accent2-soft: rgba(113, 197, 232, .35);
    --accent-ink: #ffffff;
    --danger: #9b2c2c;
    --ok: #1f5d4c;
    --radius: 8px;
  }
  html.theme-orange {
    --accent: #d2601a;
    --accent2: #f4a261;
    --accent2-soft: rgba(244, 162, 97, .35);
    --ok: #d2601a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    background: var(--accent);
    color: var(--accent-ink);
    padding: 18px 24px;
    border-bottom: 4px solid var(--accent2);
  }
  header h1 { margin: 0; font-size: 18px; letter-spacing: .01em; }
  header p { margin: 4px 0 0; opacity: .8; font-size: 13px; }
  main { width: 100%; max-width: 700px; margin: 0 auto; padding: 24px; }
  section {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px 22px;
    margin-bottom: 20px;
  }
  h2 {
    margin: 0 0 4px;
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
  }
  .hint { margin: 0 0 18px; color: var(--muted); font-size: 13px; }
  .hint.roommate-hint { margin-top: 8px; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  label.checkbox-row {
    display: flex; align-items: flex-start; gap: 8px; font-weight: normal;
    margin-bottom: 14px;
  }
  label.checkbox-row input { width: auto; margin: 2px 0 0; }
  input, select, textarea {
    width: 100%;
    padding: 8px 10px;
    margin-bottom: 14px;
    border: 1px solid var(--line);
    border-radius: 6px;
    font: inherit;
    background: #fff;
    color: var(--ink);
  }
  /* The secondary color marks the field being typed in. It is only a
     tint - the browser's own focus ring is left alone, since this blue is
     too pale to carry the focus indication by itself. */
  input:focus, select:focus, textarea:focus {
    border-color: var(--accent2);
    box-shadow: 0 0 0 3px var(--accent2-soft);
  }
  textarea { min-height: 70px; resize: vertical; }
  .grid { display: grid; gap: 14px; grid-template-columns: 1fr 1fr; }
  @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }
  .roommate {
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 14px;
    margin-bottom: 10px;
    background: #fcfcfa;
  }
  .roommate .row-head {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 10px;
  }
  .roommate .row-head strong { font-size: 13px; }
  button {
    font: inherit;
    border-radius: 6px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: var(--accent-ink);
    padding: 9px 16px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: .03em;
    font-weight: 600;
  }
  button:disabled { opacity: .55; cursor: progress; }
  button.secondary { background: transparent; color: var(--accent); }
  button.link {
    background: none; border: none; color: var(--danger);
    padding: 0; font-size: 12px; cursor: pointer; text-decoration: underline;
  }
  /* Hover fills with the secondary. The label turns dark ink rather than
     white, because white does not read on a blue this pale. */
  button:not(.link):not(:disabled):hover {
    background: var(--accent2);
    border-color: var(--accent2);
    color: var(--ink);
  }
  .msg { font-size: 13px; margin-top: 10px; }
  .msg.error { color: var(--danger); }
  .msg.ok { color: var(--ok); }
  .soon { text-align: center; padding: 48px 24px; }
  .soon h2 { margin: 0 0 8px; }
  .soon p { margin: 0; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>APPLICANT PORTAL</h1>
  <p>Lower Garden District Properties, Inc.</p>
</header>

<main>
  <section class="soon">
    <h2>Coming soon</h2>
    <p>Online applications will open here.</p>
  </section>
</main>

<script src="../shared/footer.js"></script>
</body>
</html>
