<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  // Tulane green/blue by default; ?org=O (or o) swaps in an orange scheme
  // instead, remembered via localStorage so it survives navigating here
  // from a page that set it (this app's links between pages don't carry
  // query strings). Set on <html> here, before <body> paints, so there's
  // no flash of the wrong colors.
  try {
    const params = new URLSearchParams(window.location.search);
    if (params.has("org")) {
      localStorage.setItem("lgd-org", params.get("org").toLowerCase());
    }
    if (localStorage.getItem("lgd-org") === "o") {
      document.documentElement.classList.add("theme-orange");
    }
  } catch (error) {
    /* localStorage unavailable (e.g. private browsing) - default colors. */
  }
</script>
<!-- The two main colors an admin chose, if any (shared/theme.js). -->
<script src="../shared/theme.js"></script>
<link rel="icon" href="../favicon.ico?v=2" sizes="any">
<link rel="icon" href="../shared/icons/house.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../shared/icons/apple-touch-icon.png">
<link rel="manifest" href="../shared/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="LGD PORTAL">
<link rel="stylesheet" href="../shared/site.css">
<title>Applicant Portal</title>
<style>
  :root {
    --bg: #f6f5f2;
    --panel: #ffffff;
    --ink: #1c1c1a;
    --muted: #6b6a66;
    --line: #dcdad4;
    --accent: #1f5d4c;
    --accent2: #71c5e8;
    --accent2-soft: rgba(113, 197, 232, .35);
    --accent-ink: #ffffff;
    --danger: #9b2c2c;
    --ok: #1f5d4c;
    --radius: 8px;
  }
  html.theme-orange {
    --accent: #d2601a;
    --accent2: #f4a261;
    --accent2-soft: rgba(244, 162, 97, .35);
    --ok: #d2601a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    background: var(--accent);
    color: var(--accent-ink);
    padding: 18px 24px;
    border-bottom: 4px solid var(--accent2);
  }
  header h1 { margin: 0; font-size: 18px; letter-spacing: .01em; }
  header p { margin: 4px 0 0; opacity: .8; font-size: 13px; }
  main { width: 100%; max-width: 700px; margin: 0 auto; padding: 24px; }
  section {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px 22px;
    margin-bottom: 20px;
  }
  h2 {
    margin: 0 0 4px;
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
  }
  .hint { margin: 0 0 18px; color: var(--muted); font-size: 13px; }
  .hint.roommate-hint { margin-top: 8px; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  label.checkbox-row {
    display: flex; align-items: flex-start; gap: 8px; font-weight: normal;
    margin-bottom: 14px;
  }
  label.checkbox-row input { width: auto; margin: 2px 0 0; }
  input, select, textarea {
    width: 100%;
    padding: 8px 10px;
    margin-bottom: 14px;
    border: 1px solid var(--line);
    border-radius: 6px;
    font: inherit;
    background: #fff;
    color: var(--ink);
  }
  /* The secondary color marks the field being typed in. It is only a
     tint - the browser's own focus ring is left alone, since this blue is
     too pale to carry the focus indication by itself. */
  input:focus, select:focus, textarea:focus {
    border-color: var(--accent2);
    box-shadow: 0 0 0 3px var(--accent2-soft);
  }
  textarea { min-height: 70px; resize: vertical; }
  .grid { display: grid; gap: 14px; grid-template-columns: 1fr 1fr; }
  @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }
  .roommate {
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 14px;
    margin-bottom: 10px;
    background: #fcfcfa;
  }
  .roommate .row-head {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 10px;
  }
  .roommate .row-head strong { font-size: 13px; }
  button {
    font: inherit;
    border-radius: 6px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: var(--accent-ink);
    padding: 9px 16px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: .03em;
    font-weight: 600;
  }
  button:disabled { opacity: .55; cursor: progress; }
  button.secondary { background: transparent; color: var(--accent); }
  button.link {
    background: none; border: none; color: var(--danger);
    padding: 0; font-size: 12px; cursor: pointer; text-decoration: underline;
  }
  /* Hover fills with the secondary. The label turns dark ink rather than
     white, because white does not read on a blue this pale. */
  button:not(.link):not(:disabled):hover {
    background: var(--accent2);
    border-color: var(--accent2);
    color: var(--ink);
  }
  .msg { font-size: 13px; margin-top: 10px; }
  .msg.error { color: var(--danger); }
  .msg.ok { color: var(--ok); }
  .signin-hint { margin: 14px 0 0; }
  .none-open { margin: 0; padding: 14px 16px; text-align: center; font-size: 16px; font-weight: 600;
               border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
  /* The page opens on two buttons only, one above the other. */
  .choices { display: flex; flex-direction: column; gap: 14px; padding: 28px 22px; }
  .choices button { width: 100%; padding: 16px; font-size: 16px; }
  /* The Apply and Application status popups. */
  dialog.popup {
    width: min(460px, calc(100vw - 32px));
    max-height: calc(100vh - 32px);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 22px;
    color: var(--ink);
    background: var(--panel);
    box-shadow: 0 12px 40px rgba(0, 0, 0, .3);
  }
  dialog.popup::backdrop { background: rgba(0, 0, 0, .45); }
  dialog.popup h2 { margin: 0 0 8px; }
  .popup-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
  a.button-link {
    display: inline-block; font: inherit; border-radius: 6px; border: 1px solid var(--accent);
    background: var(--accent); color: var(--accent-ink); padding: 9px 16px; text-decoration: none;
    text-transform: uppercase; letter-spacing: .03em; font-weight: 600;
  }
  a.button-link[hidden] { display: none; }
  button.linkish {
    background: none; border: none; padding: 0; color: var(--accent);
    font: inherit; font-size: 13px; text-transform: none; letter-spacing: 0;
    text-decoration: underline; cursor: pointer;
  }
  button.linkish:not(:disabled):hover { background: none; color: var(--ink); }
  .soon h2 { margin: 0 0 8px; }
  .soon p { margin: 0; color: var(--muted); }
</style>
</head>
<body>
<header>
  <p class="company">LGD (Lower Garden District Properties), Inc.</p>
  <h1>Applicant Portal</h1>
</header>

<main>
  <!-- The applicant page starts with two buttons only (the user,
       2026-09-29). Apply creates a login, and only for an email address
       already on file - someone a manager approved: the address is checked
       first (supabase/migrations/003's email_on_file), then their name and
       phone and a password are asked. LGD.auth.signUp checks the address
       again, and 001's signup trigger holds the line for a signup sent any
       other way; it also copies the name and phone onto the person on
       file. Check application status needs a login; for now it says
       "Coming soon". Each button opens its own popup (the user,
       2026-09-29), over the two buttons. -->
  <section class="choices" id="choices">
    <!-- Apply only while some property is accepting applications (the
         user, 2026-09-30); a plain statement in its place otherwise. It
         starts hidden, so it never shows and then vanishes. -->
    <button type="button" id="choose-apply" hidden>Apply</button>
    <p class="none-open" id="none-open" hidden>No apartments are available at this time.</p>
    <button type="button" class="secondary" id="choose-status">Check application status</button>
  </section>

  <dialog class="popup" id="apply" aria-labelledby="apply-title">
    <h2 id="apply-title">Apply</h2>
    <p class="hint">
      Start with the email address you gave us. Then you will create your
      account with your name, phone and a password.
    </p>
    <form id="signup-form" novalidate>
      <label for="signup-email">Email</label>
      <input type="email" id="signup-email" autocomplete="email" maxlength="254" required>
      <div id="signup-step-email">
        <button type="submit" id="signup-continue">Continue</button>
      </div>
      <div id="signup-step-details" hidden>
        <div class="grid">
          <div>
            <label for="signup-first">First name</label>
            <input type="text" id="signup-first" autocomplete="given-name" maxlength="100">
          </div>
          <div>
            <label for="signup-last">Last name</label>
            <input type="text" id="signup-last" autocomplete="family-name" maxlength="100">
          </div>
        </div>
        <label for="signup-phone">Phone</label>
        <input type="tel" id="signup-phone" inputmode="tel" autocomplete="tel" maxlength="40">
        <label for="signup-password">Password (12 or more characters)</label>
        <input type="password" id="signup-password" autocomplete="new-password" minlength="12">
        <label for="signup-confirm">Password again</label>
        <input type="password" id="signup-confirm" autocomplete="new-password" minlength="12">
        <button type="submit" id="signup-create">Create account</button>
      </div>
      <p class="msg" id="signup-msg" role="status" aria-live="polite" hidden></p>
    </form>
    <p class="hint signin-hint">
      Already have an account? <a href="../login/">Sign in</a>
    </p>
    <div class="popup-actions">
      <button type="button" class="secondary" data-close>Close</button>
    </div>
  </dialog>

  <dialog class="popup" id="status" aria-labelledby="status-title">
    <h2 id="status-title">Application status</h2>
    <p id="status-text"></p>
    <div class="popup-actions">
      <a class="button-link" id="status-signin" href="../login/" hidden>Sign in</a>
      <button type="button" class="secondary" data-close>Close</button>
    </div>
  </dialog>
</main>

<!-- The working online application form is kept, unpublished, in
     _saved/applicant_form.html (last live in commit e81c562):
     GitHub Pages' Jekyll build skips folders starting with "_". To bring it
     back, move that file back to applicant/index.html. -->
<script src="../shared/auth.js"></script>
<script>
"use strict";
(function () {
  const auth = window.LGD.auth;
  const applyPopup = document.getElementById("apply");
  const statusPopup = document.getElementById("status");
  const form = document.getElementById("signup-form");
  const email = document.getElementById("signup-email");
  const stepEmail = document.getElementById("signup-step-email");
  const stepDetails = document.getElementById("signup-step-details");
  const first = document.getElementById("signup-first");
  const last = document.getElementById("signup-last");
  const phone = document.getElementById("signup-phone");
  const password = document.getElementById("signup-password");
  const confirm = document.getElementById("signup-confirm");
  const message = document.getElementById("signup-msg");
  let checked = "";  // the address found on file, once it has been

  function say(text, isError) {
    message.textContent = text || "";
    message.className = "msg " + (isError ? "error" : "ok");
    message.hidden = !text;
  }

  function restart() {
    checked = "";
    stepDetails.hidden = true;
    stepEmail.hidden = false;
  }

  // Is any property accepting applications? The FastAPI app answers at
  // /api/accepting-applications when it served this page; on GitHub Pages
  // Supabase's accepting_applications (migration 004) does, signed out.
  // If neither answers, Apply shows: the signup still checks the email is
  // on file, so nobody gets further than they should.
  async function acceptingApplications() {
    try {
      const response = await fetch(auth.root + "api/accepting-applications", { cache: "no-store" });
      if (response.ok && (response.headers.get("content-type") || "").includes("json")) {
        return (await response.json()).accepting;
      }
    } catch (error) {
      /* No FastAPI app here - the normal case on GitHub Pages. */
    }
    return auth.acceptingApplications();
  }
  acceptingApplications()
    .catch(() => true)
    .then((accepting) => {
      document.getElementById("choose-apply").hidden = !accepting;
      document.getElementById("none-open").hidden = Boolean(accepting);
    });

  document.getElementById("choose-apply").addEventListener("click", () => {
    applyPopup.showModal();
    email.focus();
  });
  document.querySelectorAll("dialog [data-close]").forEach((control) => {
    control.addEventListener("click", () => control.closest("dialog").close());
  });
  // Closing either popup drops a #status left from coming back from sign in.
  [applyPopup, statusPopup].forEach((popup) => popup.addEventListener("close", () => {
    if (window.location.hash) history.replaceState(null, "", window.location.pathname);
  }));

  // Application status needs a login: signed out, the popup says so and
  // offers Sign in, which comes back here (#status) and opens it again;
  // signed in, it is coming soon.
  async function showStatus() {
    const text = document.getElementById("status-text");
    const signIn = document.getElementById("status-signin");
    const session = auth.configured ? await auth.session() : null;
    if (session) {
      text.textContent = "Coming soon.";
      signIn.hidden = true;
    } else {
      text.textContent = "Sign in to check your application status.";
      const back = new URL("#status", window.location.href).href;
      signIn.href = auth.root + "login/?next=" + encodeURIComponent(back);
      signIn.hidden = false;
    }
    if (!statusPopup.open) statusPopup.showModal();
  }
  document.getElementById("choose-status").addEventListener("click", showStatus);
  if (window.location.hash === "#status") showStatus();

  // A different address has to be checked again before going on.
  email.addEventListener("input", () => {
    if (checked && email.value.trim().toLowerCase() !== checked) {
      restart();
      say("");
    }
  });

  // A US number, however it was typed, reads (504) 555-1234.
  phone.addEventListener("blur", () => {
    let digits = phone.value.replace(/[^0-9]/g, "");
    if (digits.length === 11 && digits[0] === "1") digits = digits.slice(1);
    if (digits.length === 10) {
      phone.value = `(${digits.slice(0, 3)}) ${digits.slice(3, 6)}-${digits.slice(6)}`;
    }
  });

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const button = (checked ? stepDetails : stepEmail).querySelector("button[type=submit]");
    button.disabled = true;
    say("");
    try {
      const address = email.value.trim().toLowerCase();
      if (!checked) {
        if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(address)) {
          throw new auth.AuthError("That email address does not look right.");
        }
        if (!(await auth.emailOnFile(address))) throw new auth.AuthError(auth.NOT_ON_FILE);
        checked = address;
        stepEmail.hidden = true;
        stepDetails.hidden = false;
        first.focus();
        return;
      }
      const details = { first_name: first.value.trim(), last_name: last.value.trim(), phone: phone.value.trim() };
      if (!details.first_name || !details.last_name || !details.phone) {
        throw new auth.AuthError("First name, last name and phone are all needed.");
      }
      if (details.phone.replace(/[^0-9]/g, "").length < 10) {
        throw new auth.AuthError("The phone number needs at least 10 digits.");
      }
      if (password.value.length < 12) throw new auth.AuthError("The password needs 12 or more characters.");
      if (password.value !== confirm.value) throw new auth.AuthError("Those two passwords do not match.");
      const result = await auth.signUp(address, password.value,
        `${details.first_name} ${details.last_name}`, details);
      form.reset();
      restart();
      say(result.confirmationRequired
        ? "Check your email for a link to confirm the address, then sign in."
        : "Your account is ready.", false);
    } catch (error) {
      say(error.message, true);
    } finally {
      button.disabled = false;
    }
  });
})();
</script>
<script src="../shared/home.js"></script>
</body>
</html>
