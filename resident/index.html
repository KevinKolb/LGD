<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  // Tulane green/blue by default; ?org=O (or o) swaps in an orange scheme
  // instead, remembered via localStorage so it survives navigating here
  // from a page that set it (this app's links between pages don't carry
  // query strings). Set on <html> here, before <body> paints, so there's
  // no flash of the wrong colors.
  try {
    const params = new URLSearchParams(window.location.search);
    if (params.has("org")) {
      localStorage.setItem("lgd-org", params.get("org").toLowerCase());
    }
    if (localStorage.getItem("lgd-org") === "o") {
      document.documentElement.classList.add("theme-orange");
    }
  } catch (error) {
    /* localStorage unavailable (e.g. private browsing) - default colors. */
  }
</script>
<link rel="icon" href="../favicon.ico?v=1">
<link rel="stylesheet" href="../shared/site.css">
<title>Resident Portal</title>
<style>
  :root {
    --bg: #f6f5f2;
    --panel: #ffffff;
    --ink: #1c1c1a;
    --muted: #6b6a66;
    --line: #dcdad4;
    --accent: #1f5d4c;
    --accent-ink: #ffffff;
    --radius: 8px;
  }
  html.theme-orange {
    --accent: #d2601a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    background: var(--accent);
    color: var(--accent-ink);
    padding: 18px 24px;
  }
  header h1 { margin: 0; font-size: 18px; letter-spacing: .01em; }
  header p { margin: 4px 0 0; opacity: .8; font-size: 13px; }
  main { width: 100%; max-width: 700px; margin: 0 auto; padding: 24px; }
  section {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px 22px;
    margin-bottom: 20px;
  }
  h2 {
    margin: 0 0 4px;
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
  }
  .hint { margin: 0 0 18px; color: var(--muted); font-size: 13px; }
  button {
    font: inherit;
    border-radius: 6px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: var(--accent-ink);
    padding: 9px 16px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: .03em;
  }
  button:disabled { opacity: .55; cursor: progress; }
  .notice {
    border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px;
    margin-bottom: 10px; background: #fcfcfa;
  }
  .notice .when { font-size: 12px; color: var(--muted); margin: 4px 0 0; }
  .empty { color: var(--muted); font-style: italic; }
</style>
</head>
<body>
<header>
  <h1>RESIDENT PORTAL</h1>
  <p id="company-name"></p>
</header>

<main>
  <section id="login-prompt">
    <h2>Your notices</h2>
    <p class="hint">Log in to see notices from your property manager.</p>
    <button type="button" id="show-notices">Log in</button>
  </section>

  <section id="notices-section" hidden>
    <h2>Your notices</h2>
    <div id="notice-list"></div>
  </section>

  <section>
    <h2>Contact</h2>
    <p>
      LGD Properties<br>
      Pam and Steve Hartnett<br>
      <a href="tel:+15049131556">504.913.1556</a> (call or text)<br>
      <a href="mailto:LGD@neworleans.properties">LGD@neworleans.properties</a><br>
      <a href="https://neworleans.properties" target="_blank" rel="noopener">https://neworleans.properties</a>
    </p>
  </section>
</main>

<script>
"use strict";

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs)) {
    if (key === "class") node.className = value;
    else if (key === "text") node.textContent = value;
    else if (value !== null && value !== undefined) node.setAttribute(key, value);
  }
  for (const child of children) node.append(child);
  return node;
}

function renderNotices(notices) {
  const list = document.getElementById("notice-list");
  list.replaceChildren();
  if (!notices.length) {
    list.append(el("p", { class: "empty", text: "No notices yet." }));
    return;
  }
  for (const notice of notices) {
    const card = el("div", { class: "notice" });
    card.append(
      el("p", { text: notice.message }),
      el("p", { class: "when", text: new Date(notice.created_at).toLocaleString() })
    );
    list.append(card);
  }
}

// Management company shown under the heading, picked by a ?company= URL
// param rather than a login - this page is public, before anyone has an
// account. "orange" and "lgd" are the two options; anything else (or no
// param at all) leaves the line blank rather than guessing.
const COMPANY_NAMES = {
  orange: "Orange Street LLC",
  lgd: "LGD Properties",
};

function showCompanyName() {
  const company = new URLSearchParams(window.location.search).get("company");
  document.getElementById("company-name").textContent = COMPANY_NAMES[company] || "";
}

function boot() {
  showCompanyName();

  document.getElementById("show-notices").addEventListener("click", async (event) => {
    const button = event.target;
    button.disabled = true;
    try {
      // Triggers the browser's native Basic Auth prompt on the first try -
      // this page itself has no login form, since Basic Auth can't be fed
      // credentials from a page's own form.
      const response = await fetch("/api/notices");
      if (response.status === 404) {
        window.alert("That login isn't a resident account.");
        return;
      }
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const { notices } = await response.json();
      renderNotices(notices);
      document.getElementById("login-prompt").hidden = true;
      document.getElementById("notices-section").hidden = false;
    } catch (error) {
      window.alert(`Could not log in: ${error.message}`);
    } finally {
      button.disabled = false;
    }
  });
}

boot();
</script>
<script src="../shared/footer.js"></script>
</body>
</html>
