<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  // Tulane green/blue by default; ?org=O (or o) swaps in an orange scheme
  // instead, remembered via localStorage so it survives navigating here
  // from a page that set it (this app's links between pages don't carry
  // query strings). Set on <html> here, before <body> paints, so there's
  // no flash of the wrong colors.
  try {
    const params = new URLSearchParams(window.location.search);
    if (params.has("org")) {
      localStorage.setItem("lgd-org", params.get("org").toLowerCase());
    }
    if (localStorage.getItem("lgd-org") === "o") {
      document.documentElement.classList.add("theme-orange");
    }
  } catch (error) {
    /* localStorage unavailable (e.g. private browsing) - default colors. */
  }
</script>
<!-- The two main colors an admin chose, if any (shared/theme.js). -->
<script src="../shared/theme.js"></script>
<link rel="icon" href="../favicon.ico?v=2" sizes="any">
<link rel="icon" href="../shared/icons/house.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../shared/icons/apple-touch-icon.png">
<link rel="manifest" href="../shared/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Residential Guide">
<link rel="stylesheet" href="../shared/site.css">
<title>Resident Portal</title>
<style>
  :root {
    --bg: #f6f5f2;
    --panel: #ffffff;
    --ink: #1c1c1a;
    --muted: #6b6a66;
    --line: #dcdad4;
    --accent: #1f5d4c;
    --accent2: #71c5e8;
    --accent-ink: #ffffff;
    --radius: 8px;
  }
  html.theme-orange {
    --accent: #d2601a;
    --accent2: #f4a261;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    background: var(--accent);
    color: var(--accent-ink);
    padding: 18px 24px;
    border-bottom: 4px solid var(--accent2);
  }
  header h1 { margin: 0; font-size: 18px; letter-spacing: .01em; }
  header p { margin: 4px 0 0; opacity: .8; font-size: 13px; }
  main { width: 100%; max-width: 700px; margin: 0 auto; padding: 24px; }
  section {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px 22px;
    margin-bottom: 20px;
  }
  h2 {
    margin: 0 0 4px;
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
  }
  .hint { margin: 0 0 18px; color: var(--muted); font-size: 13px; }
  button {
    font: inherit;
    border-radius: 6px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: var(--accent-ink);
    padding: 9px 16px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: .03em;
    font-weight: 600;
  }
  /* Hover fills with the secondary. The label turns dark ink rather than
     white, because white does not read on a blue this pale. */
  button:not(:disabled):hover {
    background: var(--accent2);
    border-color: var(--accent2);
    color: var(--ink);
  }
  button:disabled { opacity: .55; cursor: progress; }
  .empty { color: var(--muted); font-style: italic; }
  #contact a { color: var(--accent); }
</style>
</head>
<body>
<header>
  <p class="company" data-client>Residential Guide</p>
  <h1>Resident Portal</h1>
</header>

<main>
  <section>
    <h2>Your Property Manager</h2>
    <!-- Filled from the signed-in person's own company (get_my_company,
         supabase/migrations/014) - each company has its own (the user,
         2026-10-02: "separate contact info blocks based on company. pull
         from single company table"). -->
    <p id="contact" class="empty">Loading…</p>
  </section>
</main>

<script src="../shared/auth.js"></script>
<script src="../shared/account.js"></script>
<script src="../shared/home.js"></script>
<script>
"use strict";
(async function () {
  const box = document.getElementById("contact");
  const say = (text) => { box.className = "empty"; box.textContent = text; };
  const auth = window.LGD && window.LGD.auth;
  try {
    if (!auth || !auth.configured || !(await auth.session())) {
      say("Sign in to see how to reach your property manager.");
      return;
    }
    const company = await auth.rpc("get_my_company", {});
    if (!company || !company.name) {
      say("Your login is not linked to a property manager yet.");
      return;
    }
    box.className = "";
    box.replaceChildren();
    const line = (...parts) => {
      if (box.childNodes.length) box.append(document.createElement("br"));
      box.append(...parts);
    };
    const link = (href, text, external) => {
      const a = document.createElement("a");
      a.href = href;
      a.textContent = text;
      if (external) { a.target = "_blank"; a.rel = "noopener"; }
      return a;
    };
    const telLink = (phone) => {
      const digits = phone.replace(/[^0-9]/g, "");
      return link("tel:+" + (digits.length === 10 ? "1" + digits : digits), phone);
    };
    const strong = (text) => Object.assign(document.createElement("strong"), { textContent: text });
    line(strong(company.name));
    if (company.address) line(company.address);
    // The company's managers, from people (supabase/migrations/016; the
    // user, 2026-10-03: "pull the property manager information from the
    // table of their property manager. may be multiple"): each with their
    // own phone and email. With none on file, the company's own contact.
    const team = Array.isArray(company.managers) ? company.managers : [];
    if (team.length) {
      for (const person of team) {
        box.append(document.createElement("br"));
        line(strong(person.name));
        if (person.phone) line(telLink(person.phone));
        if (person.email) line(link("mailto:" + person.email, person.email));
      }
    } else {
      if (company.contact_name) line(company.contact_name);
      if (company.phone) line(telLink(company.phone), company.phone_note ? ` (${company.phone_note})` : "");
      if (company.email) line(link("mailto:" + company.email, company.email));
    }
    if (/^https?:[/][/]/.test(company.website || "")) {
      box.append(document.createElement("br"));
      line(link(company.website, company.website.replace(/^https?:[/][/]/, "").replace(/[/]$/, ""), true));
    }
  } catch (error) {
    say("The contact information could not be loaded.");
  }
})();
</script>
</body>
</html>
