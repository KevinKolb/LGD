<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  // Tulane green/blue by default; ?org=O (or o) swaps in an orange scheme
  // instead, remembered via localStorage so it survives navigating here
  // from a page that set it (this app's links between pages don't carry
  // query strings). Set on <html> here, before <body> paints, so there's
  // no flash of the wrong colors.
  try {
    const params = new URLSearchParams(window.location.search);
    if (params.has("org")) {
      localStorage.setItem("lgd-org", params.get("org").toLowerCase());
    }
    if (localStorage.getItem("lgd-org") === "o") {
      document.documentElement.classList.add("theme-orange");
    }
  } catch (error) {
    /* localStorage unavailable (e.g. private browsing) - default colors. */
  }
</script>
<link rel="icon" href="../favicon.ico?v=1">
<link rel="stylesheet" href="../shared/site.css">
<title>Manager Dashboard</title>
<style>
  :root {
    --bg: #f6f5f2;
    --panel: #ffffff;
    --ink: #1c1c1a;
    --muted: #6b6a66;
    --line: #dcdad4;
    --accent: #1f5d4c;
    --accent-ink: #ffffff;
    --danger: #9b2c2c;
    --ok: #1f5d4c;
    --radius: 8px;
  }
  html.theme-orange {
    --accent: #d2601a;
    --ok: #d2601a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    background: var(--accent);
    color: var(--accent-ink);
    padding: 18px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  header h1 { margin: 0; font-size: 18px; letter-spacing: .01em; }
  header p { margin: 4px 0 0; opacity: .8; font-size: 13px; }
  main { width: 100%; max-width: 900px; margin: 0 auto; padding: 24px; }
  section {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px 22px;
    margin-bottom: 20px;
  }
  h2 {
    margin: 0 0 4px;
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
  }
  .hint { margin: 0 0 18px; color: var(--muted); font-size: 13px; }
  .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .button-link {
    display: inline-block;
    font: inherit;
    border-radius: 6px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: var(--accent-ink) !important;
    padding: 9px 16px;
    cursor: pointer;
    text-decoration: none;
    text-transform: uppercase;
    letter-spacing: .03em;
  }
  .button-link.secondary {
    background: transparent; color: var(--accent) !important;
  }
  a { color: var(--accent); }
</style>
</head>
<body>
<header>
  <div>
    <h1>Manager Dashboard</h1>
    <p id="whoami">Welcome</p>
  </div>
</header>

<main>
  <section>
    <h2>Paper lease</h2>
    <p class="hint">
      The standard residential lease, blank and unsigned &mdash; to print and fill
      in by hand, or just to look over.
    </p>
    <div class="actions">
      <a class="button-link secondary" id="print-lease-link"
         href="../print/lease_print.html" target="_blank" rel="noopener">Print paper lease</a>
    </div>
  </section>
</main>

<script>
"use strict";

// Greets whoever is logged in. Everything else this page used to do lives
// in landlord/working.html.
(async function () {
  try {
    const response = await fetch("/api/config");
    if (!response.ok) return;
    const config = await response.json();
    const firstName =
      (config.user.display_name || config.user.username || "").split(" ")[0];
    document.getElementById("whoami").textContent = config.user.is_admin
      ? `Welcome, ${firstName} (admin)`
      : `Welcome, ${firstName}`;
  } catch (error) {
    /* Leave the default greeting in place. */
  }
})();
</script>
<script src="account.js"></script>
<script src="../shared/footer.js"></script>
</body>
</html>
