<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  // GitHub Pages can only serve static files - this app needs a real
  // backend, so anyone landing here via GitHub Pages gets sent to the
  // actual running instance instead. No-op on every other origin,
  // including the real one this same file is served from.
  if (window.location.hostname === "kevinkolb.github.io") {
    const path = window.location.pathname.replace(/^\/LGD/, "");
    window.location.replace(
      "https://lgd-kzu4.onrender.com" + path + window.location.search
    );
  }
</script>
<link rel="icon" href="/favicon.ico">
<title>Lease Portal</title>
<style>
  :root {
    --bg: #f2f2f2;
    --panel: #ffffff;
    --ink: #1a1a1a;
    --muted: #6b6b6b;
    --line: #d9d9d9;
    --accent: #1a1a1a;
    --accent-ink: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 40px;
    max-width: 420px;
    width: calc(100% - 48px);
    text-align: center;
  }
  h1 {
    margin: 0 0 6px;
    font-size: 20px;
    letter-spacing: 0.02em;
  }
  p.hint {
    margin: 0 0 28px;
    color: var(--muted);
    font-size: 13px;
  }
  .links {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .links a {
    display: block;
    padding: 12px 16px;
    border: 1px solid var(--accent);
    border-radius: 6px;
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
  }
  .links a:hover {
    background: var(--accent);
    color: var(--accent-ink);
  }
</style>
</head>
<body>
<main>
  <h1>Lease Portal</h1>
  <p class="hint">Choose where you'd like to go.</p>
  <div class="links">
    <a href="/landlord/">Landlord</a>
    <a href="/tenant/">Tenant</a>
    <a href="/admin/">Admin</a>
  </div>
</main>
</body>
</html>
