<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  // GitHub Pages can only serve static files - this app needs a real
  // backend, so anyone landing here via GitHub Pages gets sent to the
  // actual running instance instead. No-op on every other origin,
  // including the real one this same file is served from.
  if (window.location.hostname === "kevinkolb.github.io") {
    const path = window.location.pathname.replace(/^\/LGD/, "");
    window.location.replace(
      "https://lgd-kzu4.onrender.com" + path + window.location.search
    );
  }

</script>
<script>
  // Tulane green/blue by default; ?org=O (or o) swaps in an orange scheme
  // instead, remembered via localStorage so it survives navigating to a
  // page that doesn't have the query string on its own link (every /landlord/,
  // /applicant/, /tenant/, /admin/ link in this app included). Set on
  // <html> here, before <body> paints, so there's no flash of the wrong
  // colors.
  try {
    const params = new URLSearchParams(window.location.search);
    if (params.has("org")) {
      localStorage.setItem("lgd-org", params.get("org").toLowerCase());
    }
    if (localStorage.getItem("lgd-org") === "o") {
      document.documentElement.classList.add("theme-orange");
    }
  } catch (error) {
    /* localStorage unavailable (e.g. private browsing) - default colors. */
  }
</script>
<link rel="icon" href="/favicon.ico?v=1">
<link rel="stylesheet" href="/shared/site.css">
<title>Tenant/Landlord Portal</title>
<style>
  :root {
    --bg: #f2f2f2;
    --panel: #ffffff;
    --ink: #1a1a1a;
    --muted: #6b6b6b;
    --line: #d9d9d9;
    --accent: #285c4d;
    --accent2: #71c5e8;
    --accent-ink: #ffffff;
  }
  html.theme-orange {
    --accent: #d2601a;
    --accent2: #f4a261;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main {
    background: var(--panel);
    border: 1px solid var(--line);
    border-top: 5px solid var(--accent2);
    border-radius: 8px;
    padding: 40px;
    max-width: 420px;
    width: calc(100% - 48px);
    text-align: center;
  }
  h1 {
    margin: 0 0 6px;
    font-size: 20px;
    letter-spacing: 0.02em;
    color: var(--accent);
  }
  p.hint {
    margin: 0 0 28px;
    color: var(--muted);
    font-size: 13px;
  }
  .links {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .links a {
    display: block;
    padding: 12px 16px;
    border: 1px solid var(--accent);
    border-radius: 6px;
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
  }
  .links a:hover {
    background: var(--accent);
    color: var(--accent-ink);
  }
  /* Layout comes from /shared/site.css. Here the card is centered by its
     own auto margins rather than by justify-content, so that the shared
     footer can still sit at the very bottom without stealing the free
     space the centering depends on. */
  body { justify-content: normal; }
  main { margin: auto; }
  footer { margin-top: 0; justify-content: center; }
  footer a { color: #b0b0b0; }
</style>
</head>
<body>
<main>
  <h1>Tenant/Landlord Portal</h1>
  <p class="hint">Choose your role.</p>
  <div class="links">
    <a href="/applicant/">Applicant</a>
    <a href="/tenant/">Tenant</a>
  </div>
</main>

<script src="/shared/footer.js"></script>
</body>
</html>
