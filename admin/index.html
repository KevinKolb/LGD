<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  // Tulane green/blue by default; ?org=O (or o) swaps in an orange scheme
  // instead, remembered via localStorage so it survives navigating here
  // from a page that set it (this app's links between pages don't carry
  // query strings). Set on <html> here, before <body> paints, so there's
  // no flash of the wrong colors.
  try {
    const params = new URLSearchParams(window.location.search);
    if (params.has("org")) {
      localStorage.setItem("lgd-org", params.get("org").toLowerCase());
    }
    if (localStorage.getItem("lgd-org") === "o") {
      document.documentElement.classList.add("theme-orange");
    }
  } catch (error) {
    /* localStorage unavailable (e.g. private browsing) - default colors. */
  }
</script>
<!-- The two main colors an admin chose, if any (shared/theme.js). -->
<script src="../shared/theme.js"></script>
<link rel="icon" href="../favicon.ico?v=2" sizes="any">
<link rel="icon" href="../shared/icons/house.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../shared/icons/apple-touch-icon.png">
<link rel="manifest" href="../shared/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="LGD PORTAL">
<link rel="stylesheet" href="../shared/site.css">
<title>Admin Portal</title>
<style>
  :root {
    --bg: #f6f5f2;
    --panel: #ffffff;
    --ink: #1c1c1a;
    --muted: #6b6a66;
    --line: #dcdad4;
    --accent: #1f5d4c;
    --accent2: #71c5e8;
    --accent-ink: #ffffff;
    --danger: #9b2c2c;
    --radius: 8px;
  }
  html.theme-orange {
    --accent: #d2601a;
    --accent2: #f4a261;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    background: var(--accent);
    color: var(--accent-ink);
    padding: 18px 24px;
    border-bottom: 4px solid var(--accent2);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  header h1 { margin: 0; font-size: 18px; letter-spacing: .01em; }
  main { width: 100%; max-width: 900px; margin: 0 auto; padding: 24px; }
  section {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px 22px;
    margin-bottom: 20px;
  }
  h2 {
    margin: 0 0 4px;
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
  }
  .hint { margin: 0 0 18px; color: var(--muted); font-size: 13px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 8px 16px; }
  dt { font-weight: 600; color: var(--muted); font-size: 13px; }
  dd { margin: 0; }
  .links { display: flex; gap: 16px; flex-wrap: wrap; }
  .links a {
    display: inline-block; padding: 8px 14px; border-radius: 6px;
    border: 1px solid var(--accent); color: var(--accent); text-decoration: none;
    font-weight: 600;
  }
  /* Hover fills with the secondary. The label turns dark ink rather than
     white, because white does not read on a blue this pale. */
  .links a:hover {
    background: var(--accent2);
    border-color: var(--accent2);
    color: var(--ink);
  }
  .empty { color: var(--muted); font-style: italic; }
  .notice { margin: 0 0 16px; padding: 14px 16px; background: var(--panel); border: 1px solid var(--line);
            border-radius: var(--radius); font-size: 15px; }
  .notice.ok { padding: 10px 14px; font-size: 14px; }
  button.signout {
    font: inherit; font-weight: 600; padding: 8px 16px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--accent); background: transparent; color: var(--accent);
  }
  a { color: var(--accent); }
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 999px;
    font-size: 12px; background: #eceae4; color: var(--ink); white-space: nowrap;
  }
  .badge.warn { background: #fbe6c2; color: #6b4708; }
  /* Site colors: a picker and its #rrggbb box per color, a preview of a
     header bar and a button in them, and Save / Back to the defaults. */
  .color-row { display: flex; align-items: center; gap: 12px; margin: 0 0 12px; flex-wrap: wrap; }
  .color-row label { width: 120px; font-weight: 600; font-size: 14px; }
  .color-row input[type=color] { width: 52px; height: 40px; padding: 2px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
  .color-row input[type=text] { width: 110px; padding: 8px 10px; font: inherit; font-size: 16px; border: 1px solid var(--line); border-radius: 6px; }
  .color-preview { margin: 6px 0 14px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .color-preview .bar { padding: 12px 16px; font-weight: 700; border-bottom: 4px solid; }
  .color-preview .body { padding: 12px 16px; display: flex; gap: 10px; flex-wrap: wrap; background: #fff; }
  .color-preview .sample { padding: 8px 14px; border-radius: 6px; font-weight: 600; font-size: 14px; }
  .color-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .color-actions button {
    font: inherit; font-weight: 600; padding: 9px 16px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink);
  }
  .color-actions button.secondary { background: transparent; color: var(--accent); }
  .color-actions button:disabled { opacity: .5; cursor: progress; }
  .color-msg { font-size: 13px; margin: 10px 0 0; }
  .color-msg.error { color: var(--danger); }
  .color-msg.warn { color: #6b4708; }
</style>
</head>
<body>
<header>
  <h1>Admin Portal</h1>
</header>

<main id="app">
  <p class="hint">Loading&hellip;</p>
</main>

<script src="../shared/auth.js"></script>
<script>
"use strict";

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs)) {
    if (key === "class") node.className = value;
    else if (key === "text") node.textContent = value;
    else if (value !== null && value !== undefined) node.setAttribute(key, value);
  }
  for (const child of children) node.append(child);
  return node;
}

function managersSection(managers) {
  const table = el("table");
  table.append(
    el("thead", {}, el("tr", {},
      el("th", { text: "ID" }), el("th", { text: "Manager" }),
      el("th", { text: "Signer" }), el("th", { text: "Email" })))
  );
  const body = el("tbody");
  for (const manager of managers) {
    body.append(el("tr", {},
      el("td", { text: manager.id }), el("td", { text: manager.name }),
      el("td", { text: manager.signer_name }), el("td", { text: manager.email })));
  }
  table.append(body);
  return section("Lessors", "Who a lease can be issued under.", table);
}

function usersSection(users, managers) {
  const byId = Object.fromEntries(managers.map((c) => [c.id, c.name]));
  const table = el("table");
  table.append(
    el("thead", {}, el("tr", {},
      el("th", { text: "Username" }), el("th", { text: "Role" }),
      el("th", { text: "Can act for" })))
  );
  const body = el("tbody");
  for (const u of users) {
    // role is every role this person holds, e.g. "admin, manager".
    const isAdmin = (u.roles || [u.role]).includes("admin");
    const scope = isAdmin ? "All managers" : (byId[u.manager_id] || u.manager_id || "—");
    body.append(el("tr", {},
      el("td", { text: u.username }), el("td", { text: u.role }),
      el("td", { text: scope })));
  }
  table.append(body);
  return section(
    "Users",
    "Who can log in. To add someone or change a password: python -m app.accounts set-password <username> — run against whichever backend is configured below.",
    table
  );
}

function backendsSection(backends) {
  const dl = el("dl");
  for (const [label, value] of Object.entries(backends)) {
    dl.append(el("dt", { text: label }), el("dd", { text: value }));
  }
  return section("Storage backends", "Which store is active for each piece of data.", dl);
}

function linksSection(links) {
  const box = el("div", { class: "links" });
  const labels = { github: "GitHub repo", render: "Render dashboard", supabase: "Supabase dashboard" };
  for (const [key, label] of Object.entries(labels)) {
    if (!links[key]) continue;
    box.append(el("a", { href: links[key], target: "_blank", rel: "noopener", text: label }));
  }
  return section("External dashboards", "Where the actual accounts for each service live.", box);
}

function section(title, hint, ...body) {
  const s = el("section", {});
  s.append(el("h2", { text: title }), el("p", { class: "hint", text: hint }), ...body);
  return s;
}

// --- Site colors (the user, 2026-09-30) ------------------------------------
//
// The site's two main colors, for every page: the main color (header bars,
// buttons, links) and the second (the rule under each header, hovers, the
// staff buttons). Saved through set_site_colors (supabase/migrations/005)
// or PUT /api/site-colors - admins only - and read by shared/theme.js.
function colorsSection(backend) {
  const theme = window.LGD.theme;
  const message = el("p", { class: "color-msg", role: "status", "aria-live": "polite" });
  const say = (text, kind) => { message.textContent = text; message.className = "color-msg" + (kind ? " " + kind : ""); };

  function colorRow(id, labelText) {
    const picker = el("input", { type: "color", id: id + "-picker", "aria-label": labelText });
    const box = el("input", { type: "text", id: id + "-hex", maxlength: "7", spellcheck: "false",
                              autocomplete: "off", "aria-label": labelText + " (#rrggbb)" });
    picker.addEventListener("input", () => { box.value = picker.value; preview(); });
    box.addEventListener("input", () => {
      const value = box.value.trim().toLowerCase();
      if (/^#[0-9a-f]{6}$/.test(value)) { picker.value = value; preview(); }
    });
    const row = el("div", { class: "color-row" }, el("label", { for: id + "-picker", text: labelText }), picker, box);
    return { row, picker, box };
  }
  const main = colorRow("accent", "Main color");
  const second = colorRow("accent2", "Second color");

  const bar = el("div", { class: "bar", text: "Lower Garden District Properties, Inc." });
  const primary = el("span", { class: "sample", text: "Button" });
  const outline = el("span", { class: "sample", text: "Link button" });
  const staff = el("span", { class: "sample", text: "Manager" });
  const previewBox = el("div", { class: "color-preview", "aria-hidden": "true" }, bar, el("div", { class: "body" }, primary, outline, staff));

  function values() {
    return { accent: main.picker.value.toLowerCase(), accent2: second.picker.value.toLowerCase() };
  }

  function preview() {
    const { accent, accent2 } = values();
    const ink = theme.inkOn(accent);
    Object.assign(bar.style, { background: accent, color: ink, borderBottomColor: accent2 });
    Object.assign(primary.style, { background: accent, color: ink });
    Object.assign(outline.style, { border: `1px solid ${accent}`, color: accent });
    Object.assign(staff.style, { background: accent2, color: "#1c1c1a" });
    // Labels on the second color are dark ink; a dark second color hides them.
    if (theme.luminance(accent2) < 0.3) {
      say("The second color is dark: the dark labels on it (the Manager and Admin buttons, hovers) will be hard to read.", "warn");
    } else if (message.classList.contains("warn")) {
      say("");
    }
  }

  function show(colors) {
    const accent = (colors && colors.accent) || theme.DEFAULTS.accent;
    const accent2 = (colors && colors.accent2) || theme.DEFAULTS.accent2;
    main.picker.value = main.box.value = accent;
    second.picker.value = second.box.value = accent2;
    preview();
  }

  async function call(method, body) {
    if (backend === "api") {
      const response = await fetch("/api/site-colors", method === "GET" ? {} : {
        method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(typeof payload.detail === "string" ? payload.detail : "That could not be saved.");
      return payload;
    }
    return method === "GET"
      ? window.LGD.auth.rpc("get_site_colors", {})
      : window.LGD.auth.rpc("set_site_colors", body);
  }

  const save = el("button", { type: "button", text: "Save colors" });
  const reset = el("button", { type: "button", class: "secondary", text: "Back to Tulane green and blue" });
  async function store(body, done) {
    save.disabled = reset.disabled = true;
    say("Saving…");
    try {
      const colors = await call("PUT", body);
      theme.save(colors);
      show(colors);
      say(done);
    } catch (error) {
      say(error.message, "error");
    } finally {
      save.disabled = reset.disabled = false;
    }
  }
  save.addEventListener("click", () => {
    const colors = values();
    store(colors, "Saved. Every page now uses these colors.");
  });
  reset.addEventListener("click", () => store({ accent: "", accent2: "" }, "Back to Tulane green and blue."));

  show(null);
  call("GET").then(show).catch(() => say("The saved colors could not be loaded.", "error"));

  return section("Site colors",
    "The site's two main colors, on every page. The main color is the header bars, buttons and links; " +
      "the second is the line under each header, hovers, and the Manager and Admin buttons on the home page.",
    main.row, second.row, previewBox, el("div", { class: "color-actions" }, save, reset), message);
}

async function boot() {
  const app = document.getElementById("app");
  try {
    const response = await fetch("/api/admin/info");
    // Only the FastAPI app answers in JSON. Its 404 means "not an admin";
    // any other answer - GitHub Pages' own "page not found", which is what
    // this request gets on the live site - means there is no app here, so
    // the page falls back to Supabase below. (Treating every 404 as "not an
    // admin" told the live site's admins "Admins only." until 2026-09-30.)
    const fromApp = (response.headers.get("content-type") || "").includes("json");
    if (response.status === 404 && fromApp) {
      app.replaceChildren(el("p", { class: "empty", text: "Admins only." }));
      return;
    }
    if (!response.ok || !fromApp) throw new Error(`HTTP ${response.status}`);
    const info = await response.json();
    app.replaceChildren(
      managersSection(info.managers),
      usersSection(info.users, info.managers),
      backendsSection(info.backends),
      linksSection(info.links),
      colorsSection("api")
    );
  } catch (error) {
    // No backend answered, which is the normal case on GitHub Pages: this
    // page's contents come from the FastAPI app's /api/admin/info. Fall back
    // to asking Supabase who is signed in, so an admin at least gets told
    // why the page is empty and everyone else gets turned away.
    await explainWithoutBackend(app);
  }
}

// Every way this can end says so in words - never a page left on
// "Loading…" or a bare "Admins only." (the user, 2026-09-30: "admin page
// is still blank"). Who is signed in, with which roles, is shown whenever
// they are turned away, since the usual cause is the wrong account, or a
// record without is_admin.
async function explainWithoutBackend(app) {
  const say = (text, ...more) => app.replaceChildren(el("p", { class: "notice", text }), ...more);
  try {
    const auth = window.LGD.auth;
    if (!auth.configured) {
      say("This site is not connected to its login service yet.");
      return;
    }
    const result = await auth.requireRole(["admin"]);
    if (result.reason === "signed-out") {
      say("You are not signed in. Taking you to the sign-in page…");
      return;  // already heading to the login page
    }
    if (result.reason === "unconfirmed") {
      say("You are signed in, but this login has no record on file yet, so it has no roles. " +
          "If you just signed up, click the link in the confirmation email and come back.",
          signOutButton(auth));
      return;
    }
    if (!result.ok) {
      const who = result.profile;
      say(`Signed in as ${who.display_name || who.email}${who.email ? " (" + who.email + ")" : ""}, ` +
          `with the role${who.roles.length > 1 ? "s" : ""}: ${who.role_label}. ` +
          "This page is for admins. If this login should be an admin, its record in the " +
          "people table needs is_admin set - or sign out and sign in with your admin login.",
          signOutButton(auth));
      return;
    }
    app.replaceChildren(
      el("p", { class: "notice ok", text: `Signed in as ${result.profile.display_name || result.profile.email} (admin).` }),
      colorsSection("supabase"),
      el("p", { class: "empty", text:
        "The managers, users and storage backends come from the app's own API, which is " +
        "not running here - start it locally to see them." }));
  } catch (error) {
    say("The admin page could not load: " + (error && error.message ? error.message : error) +
        ". Check your connection and reload.");
  }
}

function signOutButton(auth) {
  const button = el("button", { type: "button", class: "signout", text: "Sign out" });
  button.addEventListener("click", async () => {
    await auth.signOut();
    window.location.reload();
  });
  return button;
}

// A last resort: if nothing has answered in 20 seconds, say so.
setTimeout(() => {
  const app = document.getElementById("app");
  if (app.textContent.trim() === "Loading…") {
    app.replaceChildren(el("p", { class: "notice", text:
      "This is taking too long - the login service did not answer. Check your connection and reload." }));
  }
}, 20000);

boot();
</script>
<script src="../shared/account.js"></script>
<script src="../shared/home.js"></script>
</body>
</html>
